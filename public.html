<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>採鮮農產行｜當日報價單</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC','PingFang TC',sans-serif;background:#fff;color:#111;font-size:14px;-webkit-font-smoothing:antialiased}
.page{max-width:1080px;margin:0 auto;padding:28px 24px 48px}

/* ── Header ── */
.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:12px;flex-wrap:wrap}
.shop-name{font-size:32px;font-weight:900;color:#2d6a2d}
.shop-info{font-size:14px;color:#444;margin-top:8px;line-height:2}
.date-block{text-align:right}
.date-label{font-size:20px;font-weight:900;color:#222}
.date-value{font-size:14px;color:#444;margin-top:4px}
.date-note{font-size:12px;color:#c05a00;margin-top:3px}
.updated{font-size:11px;color:#bbb;margin-top:4px}

/* ── 三欄 Grid ── */
.price-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  border:1.5px solid #dde8dd;
  border-radius:6px;
  overflow:hidden;
}
.price-col{
  border-right:1.5px solid #dde8dd;
  display:flex;
  flex-direction:column;
}
.price-col:last-child{border-right:none}

/* ── Category header ── */
.cat-hdr{
  padding:10px 14px;
  font-size:14px;font-weight:900;color:#fff;
  letter-spacing:.02em;
}
.col-lbl{
  display:flex;justify-content:space-between;
  padding:5px 12px;
  font-size:11px;font-weight:700;color:#999;
  border-bottom:1px solid #e8eee8;
  text-transform:uppercase;letter-spacing:.04em;
}

/* ── Item rows ── */
.item{
  display:flex;justify-content:space-between;align-items:center;
  padding:6px 12px;
  border-bottom:1px solid #f0f5f0;
  font-size:14px;
}
.item:last-child{border-bottom:none}
.item-name{color:#222;flex:1;padding-right:10px}
.item-price{font-weight:900;white-space:nowrap;font-size:15px}
.item-price.up{color:#c0392b}
.item-price.down{color:#1565c0}
.arrow{font-size:12px;margin-left:1px}
.no-price{color:#bbb;font-weight:400;font-size:13px}

/* 截切與葉菜分隔 */
.cat-divider{border-top:2px solid #dde8dd}

/* ── Footer ── */
.footer{margin-top:18px;text-align:center;font-size:12px;color:#888;line-height:2.2}
.footer-bold{font-weight:900;color:#2d6a2d;font-size:14px}

/* ── 手機：兩欄 ── */
@media(max-width:700px){
  .price-grid{grid-template-columns:1fr 1fr}
  .price-col:nth-child(2){border-right:none}
  .price-col:nth-child(3){border-top:1.5px solid #dde8dd;border-right:1.5px solid #dde8dd}
  .price-col:nth-child(4){border-top:1.5px solid #dde8dd;border-right:none}
}

.loading{text-align:center;padding:60px;color:#888;font-size:15px}
</style>
</head>
<body>
<div class="page" id="app"><div class="loading">載入中…</div></div>

<script>
const FB_PROJECT_ID = 'caixian-price-619c4';
const FB_API_KEY    = 'AIzaSyDyIgF1T3qwVUdxTtfuo9SRwpiEQpfMaIA';

function today() {
  const d = new Date();
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── 計算售價 ────────────────────────────────────────────────────────────────
function calcSell(item, all) {
  if (item.cat === 'c4' && item.srcId) return cutPrice(item, all);
  const cost = Number(item.cost)||0;
  if (!cost) return Number(item.price)||0;
  if (item.type==='manual') return Number(item.price)||0;
  if (item.type==='fixed')  return cost + (Number(item.markup)||0);
  return Math.round(cost * (1 + (Number(item.markup)||0) / 100));
}

function cutPrice(item, all) {
  const src = all.find(i => i.id === item.srcId);
  if (!src) return 0;
  if ((item.cutType||'whole') === 'whole') {
    const sp = calcSell(src, all);
    return sp ? Math.round(sp + (Number(item.cutFee)||0)) : 0;
  }
  // 散切：自動找同原料整件切
  const whole = all.find(i => i.cat==='c4' && i.srcId===item.srcId && (i.cutType||'whole')==='whole' && i.id!==item.id);
  const base  = whole ? calcSell(whole, all) : calcSell(src, all);
  if (!base) return 0;
  const w = Number(item.srcWeight)||1;
  const y = Number(item.cutYield)||1;
  const a = Number(item.cutAddon)||0;
  return Math.round((base/w)/y + a);
}

// ── 建立品項列 ───────────────────────────────────────────────────────────────
function itemRow(item, all) {
  const sp   = calcSell(item, all);
  const cls  = item.trend==='up' ? ' up' : item.trend==='down' ? ' down' : '';
  const arrow = item.trend==='up'   ? `<span class="arrow">↑</span>`
              : item.trend==='down' ? `<span class="arrow">↓</span>` : '';
  const price = sp > 0
    ? `<span class="item-price${cls}">${sp}${arrow}</span>`
    : `<span class="no-price">暫無</span>`;
  return `<div class="item"><span class="item-name">${esc(item.name)}</span>${price}</div>`;
}

// ── 建立類別區塊 ─────────────────────────────────────────────────────────────
function catBlock(cat, all, divider) {
  const rows = all.filter(i => i.cat===cat.id && i.visible!==false);
  if (!rows.length) return '';
  return `
    ${divider ? '<div class="cat-divider"></div>' : ''}
    <div class="cat-hdr" style="background:${esc(cat.color)}">${esc(cat.name)}</div>
    <div class="col-lbl"><span>品項</span><span>單價</span></div>
    ${rows.map(i => itemRow(i, all)).join('')}`;
}

// ── 渲染頁面 ─────────────────────────────────────────────────────────────────
function render(data) {
  const meta = data.meta  || {};
  const all  = data.items || [];
  const upd  = data.updatedAt ? new Date(data.updatedAt).toLocaleString('zh-TW') : '';

  // 欄位定義
  const COL_LEFT  = [{id:'c4',name:'🔪 蔬菜截切',color:'#1a6a6a'},{id:'c1',name:'🥬 葉菜類',color:'#3a8a3a'}];
  const COL_MID   = [{id:'c2',name:'🍈 瓜果類',  color:'#c05a00'}];
  const COL_RIGHT = [{id:'c3',name:'🍄 菇與其他',color:'#6a3aaa'}];

  function buildCol(cats) {
    return cats.map((cat, i) => catBlock(cat, all, i > 0)).join('');
  }

  document.getElementById('app').innerHTML = `
    <div class="hdr">
      <div>
        <div class="shop-name">${esc(meta.name||'採鮮農產行')}</div>
        <div class="shop-info">
          聯絡人：${esc(meta.contact||'')}<br>
          手機：${esc(meta.phone||'')}<br>
          LINE：${esc(meta.line||'')}
        </div>
      </div>
      <div class="date-block">
        <div class="date-label">當日報價單</div>
        <div class="date-value">報價日期：${today()}</div>
        <div class="date-note">※ 本報價單以當日行情價為準</div>
        ${upd ? `<div class="updated">最後更新：${upd}</div>` : ''}
      </div>
    </div>

    <div class="price-grid">
      <div class="price-col">${buildCol(COL_LEFT)}</div>
      <div class="price-col">${buildCol(COL_MID)}</div>
      <div class="price-col">${buildCol(COL_RIGHT)}</div>
    </div>

    <div class="footer">
      <div>※ ${esc(meta.note||'價格以當日市場行情為準，如有異動恕不另行通知')}</div>
      <div class="footer-bold">感謝您的支持與愛護 🙏</div>
    </div>`;
}

// ── Firebase 載入 ────────────────────────────────────────────────────────────
async function load() {
  try {
    const app = firebase.apps[0] || firebase.initializeApp({
      apiKey: FB_API_KEY, projectId: FB_PROJECT_ID,
      authDomain: `${FB_PROJECT_ID}.firebaseapp.com`
    });
    app.firestore().collection('price_board').doc('current').onSnapshot(snap => {
      if (snap.exists) render(snap.data());
      else document.getElementById('app').innerHTML = '<div class="loading">尚無報價資料</div>';
    }, err => {
      document.getElementById('app').innerHTML = `<div class="loading">載入失敗：${err.message}</div>`;
    });
  } catch(e) {
    document.getElementById('app').innerHTML = `<div class="loading">錯誤：${e.message}</div>`;
  }
}
load();
</script>
</body>
</html>
